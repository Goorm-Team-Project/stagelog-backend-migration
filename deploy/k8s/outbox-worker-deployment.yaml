apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagelog-outbox-worker
  labels:
    app: stagelog-outbox-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stagelog-outbox-worker
  template:
    metadata:
      labels:
        app: stagelog-outbox-worker
    spec:
      # EventBridge PutEvents 권한이 있는 ServiceAccount로 교체
      serviceAccountName: stagelog-backend-sa
      containers:
      - name: outbox-worker
        # 실제 백엔드 이미지 태그로 교체
        image: your-dockerhub/stagelog-repo:api
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          while true; do
            python manage.py publish_outbox_all_databases \
              --databases="${OUTBOX_DATABASES:-default,auth_db,events_db}" \
              --limit="${OUTBOX_PUBLISH_BATCH_SIZE:-50}" \
              --max-retries="${OUTBOX_MAX_RETRIES:-5}" \
              --retry-base-delay-seconds="${OUTBOX_RETRY_BASE_DELAY_SECONDS:-30}";
            sleep "${OUTBOX_PUBLISH_INTERVAL_SECONDS:-3}";
          done
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: config.settings
        - name: OUTBOX_DATABASES
          value: default,auth_db,events_db
        - name: OUTBOX_PUBLISH_INTERVAL_SECONDS
          value: "3"
        # 기존 백엔드 배포와 동일한 Secret 사용
        envFrom:
        - secretRef:
            name: stagelog-backend-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 384Mi
