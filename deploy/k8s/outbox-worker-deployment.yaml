apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagelog-outbox-worker
  namespace: dev-backend
  labels:
    app: stagelog-outbox-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stagelog-outbox-worker
  template:
    metadata:
      labels:
        app: stagelog-outbox-worker
    spec:
      # EventBridge PutEvents 권한이 있는 ServiceAccount로 교체
      serviceAccountName: stagelog-backend-sa
      containers:
      - name: outbox-worker
        image: 430118823715.dkr.ecr.ap-northeast-2.amazonaws.com/stagelog-backend:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          if [ -f /app/.env ]; then
            set -a
            . /app/.env
            set +a
          fi
          while true; do
            python manage.py publish_outbox_all_databases \
              --databases="${OUTBOX_DATABASES:-default,auth_db,events_db}" \
              --limit="${OUTBOX_PUBLISH_BATCH_SIZE:-50}" \
              --max-retries="${OUTBOX_MAX_RETRIES:-5}" \
              --retry-base-delay-seconds="${OUTBOX_RETRY_BASE_DELAY_SECONDS:-30}";
            sleep "${OUTBOX_PUBLISH_INTERVAL_SECONDS:-3}";
          done
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: config.settings
        - name: OUTBOX_DATABASES
          value: default,auth_db,events_db
        - name: OUTBOX_PUBLISH_INTERVAL_SECONDS
          value: "3"
        volumeMounts:
        - name: backend-env-file
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 384Mi
      volumes:
      - name: backend-env-file
        secret:
          secretName: dev-secret
          items:
          - key: .env
            path: .env
