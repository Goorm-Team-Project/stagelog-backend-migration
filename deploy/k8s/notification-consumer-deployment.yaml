apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagelog-notification-consumer
  namespace: dev-backend
  labels:
    app: stagelog-notification-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stagelog-notification-consumer
  template:
    metadata:
      labels:
        app: stagelog-notification-consumer
    spec:
      # SQS + DynamoDB 권한이 있는 ServiceAccount로 교체
      serviceAccountName: stagelog-backend-sa
      containers:
      - name: notification-consumer
        # 실제 백엔드 이미지 태그로 교체
        image: your-dockerhub/stagelog-repo:api
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          if [ -f /app/.env ]; then
            set -a
            . /app/.env
            set +a
          fi
          while true; do
            python manage.py consume_notification_queue \
              --queue-url="${NOTIFICATION_SQS_QUEUE_URL}" \
              --max-messages="${NOTIFICATION_CONSUMER_MAX_MESSAGES:-10}" \
              --wait-time-seconds="${NOTIFICATION_CONSUMER_WAIT_TIME_SECONDS:-20}";
            sleep 1;
          done
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: config.settings
        volumeMounts:
        - name: backend-env-file
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 512Mi
      volumes:
      - name: backend-env-file
        secret:
          secretName: stagelog-backend-env
          items:
          - key: .env
            path: .env
