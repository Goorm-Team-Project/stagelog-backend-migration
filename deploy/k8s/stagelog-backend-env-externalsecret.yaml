apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stagelog-backend-env
  namespace: dev-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: stagelog-backend-env
    creationPolicy: Owner
  data:
  - secretKey: .env
    remoteRef:
      key: /stagelog/backend/.env
