apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stagelog-public-api
  namespace: stagelog
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # 실제 ACM 인증서 ARN으로 교체
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:<account-id>:certificate/<certificate-id>
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/group.name: stagelog-public-api
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: auth-svc
            port:
              number: 8000
      - path: /api/users/
        pathType: Prefix
        backend:
          service:
            name: auth-svc
            port:
              number: 8000
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: events-svc
            port:
              number: 8000
      - path: /api/events/
        pathType: Prefix
        backend:
          service:
            name: events-svc
            port:
              number: 8000
      - path: /api/bookmarks
        pathType: Prefix
        backend:
          service:
            name: auth-svc
            port:
              number: 8000
      - path: /api/bookmarks/
        pathType: Prefix
        backend:
          service:
            name: auth-svc
            port:
              number: 8000
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: core-svc
            port:
              number: 8000
